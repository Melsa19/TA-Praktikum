<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Booking Salon</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Eksternal -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
  <div class="container">
    <a class="navbar-brand" href="#">The Girls Club</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#formBooking">Booking</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!--  HERO SECTION  -->
<section class="hero text-center text-white d-flex align-items-center">
    <div class="container">
        <h1>Sistem Manajemen Booking Salon</h1>
        <p>Mengelola jadwal dan layanan salon dengan mudah dan efisien.</p>
    </div>
</section>

<!-- STATISTIK  -->
<section class="container my-5">
    <div class="row text-center">

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h3>120+</h3>
                    <p>Total Pelanggan</p>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h3>15</h3>
                    <p>Layanan Tersedia</p>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h3>30</h3>
                    <p>Booking Hari Ini</p>
                </div>
            </div>
        </div>

    </div>
</section>

<!--  FORM BOOKING  -->
<section class="container my-5" id="formBooking">
    <h2 class="text-center mb-4">Form Booking Salon</h2>

    <form class="p-4 shadow rounded bg-light">

        <div class="mb-3">
            <label class="form-label">Nama Pelanggan</label>
            <input type="text" class="form-control" placeholder="Masukkan nama">
        </div>

        <div class="mb-3">
            <label class="form-label">No. HP</label>
            <input type="text" class="form-control" placeholder="Masukkan nomor HP">
        </div>

        <div class="mb-3">
            <label class="form-label">Pilih Layanan</label>
            <select class="form-select">
                <option>Haircut</option>
                <option>Hair Coloring</option>
                <option>Creambath</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Tanggal Booking</label>
            <input type="date" class="form-control">
        </div>

        <button type="submit" class="btn btn-pink w-100">Booking Sekarang</button>
    </form>
</section>

<!--  FOOTER -->
<footer class="text-center p-3 custom-footer">
    <p>© 2026 TheGirlsClub - Sistem Manajemen Booking Salon</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
